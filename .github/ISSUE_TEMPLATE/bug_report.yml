name: Bug report
description: Report a reproducible problem in CliffQuant.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove secrets
        and private data from logs before submitting.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or Git commit SHA you tested.
      placeholder: "0.1.1 or abc1234"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and Python version.
      placeholder: "Ubuntu 24.04, Python 3.11.9"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest command or code sample that reproduces the problem.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste the relevant error and traceback; do not include secrets.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private data from the report.
          required: true
